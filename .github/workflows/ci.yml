name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - name: Lint and type check
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy
      - name: Tests and coverage
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Build distributions
        run: python -m build
      - name: Audit dependencies
        run: pip-audit
      - name: Container build and offline smoke
        run: |
          docker build -t secure-agent-proof .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges secure-agent-proof
